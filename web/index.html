<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AsiaPulse AI · Asia's Economic Growth to 2035</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f8cff'/><path d='M6 20l6-6 5 4 9-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=5" />
  <script>try { const t = localStorage.getItem("ap-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand" onclick="go('outlook')">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      </div>
      <div><b>AsiaPulse AI</b><small>10-year growth forecasts · Asia</small></div>
    </div>
    <button class="search-btn" onclick="openPalette()" title="Search economies (Ctrl+K)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span>Economy: <span class="cur" id="curName">—</span></span><span class="kbd">Ctrl K</span>
    </button>
    <div class="ticker"><div class="ticker-track" id="ticker"></div></div>
    <span class="live-pill" id="livePill"><span class="dot"></span>LIVE</span>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark" onclick="toggleTheme()"></button>
  </header>

  <nav class="rail" id="rail"></nav>
  <main id="main"></main>

  <div class="overlay" id="overlay" onclick="if(event.target===this) closePalette()">
    <div class="palette">
      <input id="palInput" placeholder="Search 47 Asian economies…" autocomplete="off" />
      <div class="pal-list" id="palList"></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/app.js?v=5"></script>
</body>
</html>
