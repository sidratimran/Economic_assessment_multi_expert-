services:
  - type: web
    name: asiapulse-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        sync: false
      - key: QWEN_MODEL
        sync: false
      - key: QWEN_MAX_TOKENS
        value: "900"
